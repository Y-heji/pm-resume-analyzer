<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </linearGradient>
    <filter id="glow1"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg1)"/>
  <circle cx="540" cy="500" r="400" fill="#ff4444" opacity="0.08" filter="url(#glow1)"/>

  <!-- 200 份大数字冲击 -->
  <text x="540" y="600" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="200" font-weight="900" fill="#ff4444" letter-spacing="8">200</text>
  <text x="540" y="720" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="52" font-weight="700" fill="#ffffff">份简历投出去</text>

  <!-- 结果 -->
  <text x="540" y="960" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="180" font-weight="900" fill="#ff4444" opacity="0.9">0</text>
  <text x="540" y="1060" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="48" font-weight="700" fill="#cccccc">个面试邀请</text>

  <line x1="340" y1="1120" x2="740" y2="1120" stroke="#ff4444" stroke-width="2" opacity="0.5"/>

  <text x="540" y="1220" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="44" font-weight="700" fill="#ffffff">不是你不优秀</text>
  <text x="540" y="1320" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="40" font-weight="700" fill="#ff6666">是机器根本没读到</text>

  <!-- Bottom -->
  <text x="540" y="1600" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="28" fill="#666">AI 职业经理师</text>
</svg>