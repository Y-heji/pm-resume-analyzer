  <text x="150" y="360" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#1e293b">数据说话</text>
  <text x="150" y="390" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#64748b">交付时附带ATS诊断报告，看得见的提升 · 改前改后匹配分对比</text>

  <!-- Point 4 -->
