  <text x="400" y="730" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#64748b">匹配分提升</text>

  <rect x="520" y="680" width="180" height="60" rx="12" fill="#f59e0b" opacity="0.1"/>
  <text x="610" y="710" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="900" fill="#f59e0b">24h</text>
  <text x="610" y="730" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#64748b">交付初版</text>
