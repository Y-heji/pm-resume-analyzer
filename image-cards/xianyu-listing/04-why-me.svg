  <text x="150" y="140" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#1e293b">AI + 人工双重把关</text>
  <text x="150" y="170" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#64748b">AI精准诊断 + 我人工复核润色，比纯AI更懂HR想看什么</text>

  <!-- Point 2 -->
