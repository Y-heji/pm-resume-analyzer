<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#eff6ff"/><stop offset="100%" stop-color="#fff"/></linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg4)"/>
  <rect x="0" y="0" width="800" height="5" fill="#2563eb"/>

  <text x="400" y="60" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="900" fill="#1e293b">为什么选我？</text>

  <!-- Point 1 -->
  <rect x="60" y="110" width="680" height="90" rx="14" fill="white" stroke="#e2e8f0"/>
