<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1067">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#fef2f2"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1067" fill="url(#bg)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="800" height="8" fill="#dc2626"/>

  <!-- Big stat -->
  <text x="400" y="260" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="96" font-weight="900" fill="#dc2626">200</text>
  <text x="400" y="330" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="28" font-weight="700" fill="#991b1b">份简历投出去</text>

  <!-- Big zero -->
  <text x="400" y="490" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="140" font-weight="900" fill="#dc2626">0</text>
  <text x="400" y="560" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="28" font-weight="700" fill="#991b1b">个面试邀请</text>

  <!-- Divider -->
  <line x1="200" y1="620" x2="600" y2="620" stroke="#fca5a5" stroke-width="1"/>

  <!-- Bottom text -->
  <text x="400" y="690" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="22" font-weight="700" fill="#1e293b">
    不是你不优秀
  </text>
  <text x="400" y="740" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="22" font-weight="700" fill="#2563eb">
    是 ATS 根本没读到你的简历
  </text>

  <!-- Sub text -->
  <text x="400" y="820" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#64748b">
    大厂 HR 看简历前，机器先筛掉 70%
  </text>

  <!-- Arrow cue -->
  <text x="400" y="880" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="32" fill="#dc2626">→ 右滑看为什么</text>

  <!-- Bottom brand -->
  <text x="400" y="1000" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">
    AI 职业师 · 帮你过 ATS 第一关
  </text>
</svg>