<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1067">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="proGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1067" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="8" fill="#16a34a"/>

  <!-- Header -->
  <text x="400" y="90" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="32" font-weight="900" fill="#16a34a">改完当天投 5 家</text>
  <text x="400" y="175" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="100" font-weight="900" fill="#16a34a">3</text>
  <text x="400" y="230" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="24" font-weight="700" fill="#166534">家直接约面试</text>

  <line x1="280" y1="260" x2="520" y2="260" stroke="#bbf7d0" stroke-width="2"/>

  <text x="400" y="300" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="16" font-weight="700" fill="#64748b">同一个经历，改完判若两人</text>

  <!-- Before -->
  <rect x="60" y="330" width="680" height="110" rx="14" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="400" y="360" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="15" font-weight="700" fill="#991b1b">❌ 改之前</text>
  <text x="400" y="395" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="16" fill="#7f1d1d">"负责社群运营，在群里发内容和优惠券"</text>
  <text x="400" y="420" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="13" fill="#b91c1c">没有数据  ·  没有关键词  ·  动词太弱</text>

  <!-- Arrow -->
  <line x1="400" y1="460" x2="400" y2="500" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="400,508 392,496 408,496" fill="#94a3b8"/>

  <!-- After -->
  <rect x="40" y="520" width="720" height="220" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
  <rect x="40" y="520" width="720" height="48" rx="16" fill="url(#proGrad)"/>
  <rect x="40" y="552" width="720" height="16" fill="url(#proGrad)"/>
  <text x="400" y="551" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="17" font-weight="700" fill="white">✅ AI 优化之后</text>

  <text x="400" y="615" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="16" font-weight="600" fill="#1e293b">"主导 3 个 500 人微信社群运营，</text>
  <text x="400" y="650" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="16" font-weight="600" fill="#1e293b"> 策划日更内容和周度优惠活动，</text>
  <text x="400" y="685" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="16" font-weight="600" fill="#1e293b"> 月均触达 3000+ 用户，"</text>
  <text x="400" y="715" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="16" font-weight="600" fill="#1e293b"> 社群活跃度维持在 60% 以上。"</text>

  <!-- Tags centered -->
  <rect x="170" y="775" width="100" height="26" rx="8" fill="#dcfce7"/>
  <text x="220" y="793" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#16a34a">✅ STAR 重构</text>
  <rect x="290" y="775" width="100" height="26" rx="8" fill="#dcfce7"/>
  <text x="340" y="793" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#16a34a">✅ 数据量化</text>
  <rect x="410" y="775" width="120" height="26" rx="8" fill="#dcfce7"/>
  <text x="470" y="793" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#16a34a">✅ ATS 关键词</text>
  <rect x="550" y="775" width="80" height="26" rx="8" fill="#dcfce7"/>
  <text x="590" y="793" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#16a34a">✅ 术语</text>

  <!-- CTA -->
  <rect x="100" y="920" width="600" height="72" rx="18" fill="#2563eb"/>
  <text x="400" y="955" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="17" font-weight="700" fill="white">🎁 免费用 AI 诊断你的简历 → ai职业经理师.xyz</text>

  <text x="400" y="1030" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" font-weight="700" fill="#1e293b">来主页 · 免费诊断你的简历</text>
</svg>