<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1067">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </linearGradient>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff4444"/>
      <stop offset="100%" stop-color="#cc2233"/>
    </linearGradient>
    <filter id="shadow3">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#ff4444" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="1067" fill="url(#bg3)"/>

  <!-- Top accent -->
  <rect x="0" y="0" width="800" height="4" fill="#ff4444"/>

  <!-- Central visual: Abstract practice loop -->
  <circle cx="400" cy="280" r="160" fill="none" stroke="#ff4444" stroke-width="1" opacity="0.15"/>
  <circle cx="400" cy="280" r="120" fill="none" stroke="#ff4444" stroke-width="1.5" opacity="0.25"/>
  <circle cx="400" cy="280" r="80" fill="none" stroke="#ff4444" stroke-width="2" opacity="0.4"/>

  <!-- AI icon in center -->
  <rect x="355" y="235" width="90" height="90" rx="20" fill="#1a1a2e" stroke="#ff4444" stroke-width="2.5"/>
  <text x="400" y="275" text-anchor="middle" font-family="sans-serif" font-size="36">🤖</text>
  <text x="400" y="305" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" fill="#ff4444" font-weight="700">AI 面试官</text>

  <!-- Orbit dots -->
  <circle cx="520" cy="200" r="4" fill="#ff4444" opacity="0.5"/>
  <circle cx="560" cy="280" r="3" fill="#ff4444" opacity="0.3"/>
  <circle cx="520" cy="360" r="4" fill="#ff4444" opacity="0.5"/>
  <circle cx="240" cy="200" r="3" fill="#ff4444" opacity="0.3"/>
  <circle cx="280" cy="360" r="4" fill="#ff4444" opacity="0.5"/>

  <!-- Main headline -->
  <text x="400" y="480" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="4">
    真正面试前
  </text>
  <text x="400" y="550" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="44" font-weight="700" fill="#ff4444" letter-spacing="6">
    和 AI 先练三遍
  </text>

  <line x1="280" y1="580" x2="520" y2="580" stroke="#444" stroke-width="1"/>

  <!-- 3 Benefit Points -->
  <rect x="120" y="620" width="560" height="55" rx="10" fill="#1a1a28" stroke="#2a2a3a" stroke-width="1"/>
  <text x="145" y="655" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="20" fill="#ffffff">🎯 提前踩完所有雷区，不上真实战场当炮灰</text>

  <rect x="120" y="690" width="560" height="55" rx="10" fill="#1a1a28" stroke="#2a2a3a" stroke-width="1"/>
  <text x="145" y="725" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="20" fill="#ffffff">💬 真实面试对话模拟，AI 面试官追问到底</text>

  <rect x="120" y="760" width="560" height="55" rx="10" fill="#1a1a28" stroke="#2a2a3a" stroke-width="1"/>
  <text x="145" y="795" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="20" fill="#ffffff">📊 练完即时出诊断报告，知道哪里扣分</text>

  <!-- CTA Button -->
  <rect x="180" y="870" width="440" height="64" rx="32" fill="url(#ctaGrad)" filter="url(#shadow3)"/>
  <text x="400" y="910" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="26" font-weight="900" fill="#ffffff" letter-spacing="3">
    来主页免费测面试水平
  </text>
  <text x="400" y="960" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="14" fill="#888">
    不用等，现在就能练
  </text>

  <!-- Bottom branding -->
  <rect x="0" y="1020" width="800" height="47" fill="#111" opacity="0.8"/>
  <text x="400" y="1050" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="14" fill="#666" letter-spacing="2">
    AI 职业经理师 · AI 简历诊断 + 模拟面试
  </text>
</svg>