  <text x="275" y="733" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="10" fill="#16a34a">✅ 数据量化</text>
  <rect x="340" y="718" width="110" height="22" rx="6" fill="#dcfce7"/>
