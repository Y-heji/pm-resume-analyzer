<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1067">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f7ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fff"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fff"/>
    </linearGradient>
    <linearGradient id="card3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="1067" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="6" fill="#2563eb"/>

  <!-- Header area -->
  <text x="400" y="80" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="36" font-weight="900" fill="#1e293b">
    这个运营简历
  </text>
  <text x="400" y="130" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="36" font-weight="900" fill="#2563eb">
    ATS 为什么只给了 20 分？
  </text>

  <!-- Subtitle -->
  <text x="400" y="175" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="16" fill="#64748b">
    AI 诊断报告 · 真实案例
  </text>

  <!-- Divider -->
  <line x1="300" y1="200" x2="500" y2="200" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Card 1: Score -->
  <rect x="80" y="260" width="640" height="160" rx="16" fill="url(#card1)" stroke="#fecaca" stroke-width="1.5"/>
  <rect x="80" y="260" width="8" height="160" rx="4" fill="#ef4444"/>
  <text x="120" y="295" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="16" font-weight="700" fill="#991b1b">📊 岗位匹配度</text>
  <text x="120" y="340" font-family="'JetBrains Mono',monospace" font-size="64" font-weight="900" fill="#dc2626">20</text>
  <text x="240" y="340" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="20" fill="#991b1b">/ 100</text>
  <text x="120" y="375" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#7f1d1d">技能匹配低 · 关键词缺失严重 · 格式可读性差</text>

  <!-- Card 2: Risks -->
  <rect x="80" y="450" width="640" height="160" rx="16" fill="url(#card2)" stroke="#fed7aa" stroke-width="1.5"/>
  <rect x="80" y="450" width="8" height="160" rx="4" fill="#f97316"/>
  <text x="120" y="485" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="16" font-weight="700" fill="#9a3412">⚠️ ATS 系统风险</text>
  <text x="120" y="530" font-family="'JetBrains Mono',monospace" font-size="64" font-weight="900" fill="#f97316">5</text>
  <text x="178" y="530" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="20" fill="#9a3412">项</text>
  <text x="120" y="565" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#7c2d12">日期格式问题 · 缺少关键技能词 · 排版兼容性 · 量化缺失 · 动词单调</text>

  <!-- Card 3: Gaps -->
  <rect x="80" y="640" width="640" height="160" rx="16" fill="url(#card3)" stroke="#fde68a" stroke-width="1.5"/>
  <rect x="80" y="640" width="8" height="160" rx="4" fill="#eab308"/>
  <text x="120" y="675" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="16" font-weight="700" fill="#854d0e">🔍 关键技能缺口</text>
  <text x="120" y="720" font-family="'JetBrains Mono',monospace" font-size="64" font-weight="900" fill="#eab308">8</text>
  <text x="178" y="720" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="20" fill="#854d0e">项</text>
  <text x="120" y="755" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#713f12">数据分析 · 用户增长 · SQL · AB测试 · 竞品分析 · 项目管理 · 文案策划 · 私域运营</text>

  <!-- CTA -->
  <rect x="180" y="870" width="440" height="56" rx="28" fill="#2563eb"/>
  <text x="400" y="906" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="18" font-weight="700" fill="#fff">
    🔍 AI 职业师 · 免费简历诊断
  </text>

  <!-- Bottom text -->
  <text x="400" y="960" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#94a3b8">
    上传你的简历，看看能得多少分？→ ai-career.xyz
  </text>

  <!-- Brand -->
  <text x="400" y="1010" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">
    AI 职业师 · 帮助求职者找到更好的工作
  </text>
</svg>